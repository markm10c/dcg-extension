<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html {
        display: flex;
        justify-content: center;
      }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        width: 300px;
        margin: 0;
        padding: 20px;
        color: #111827;
      }
      [hidden] {
        display: none !important;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      header img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #16b364;
      }
      .dot.waiting {
        background: #f79009;
      }
      p {
        margin: 6px 0 0;
        color: #4d5761;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #6366f1;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      footer {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 12px;
        color: #9da4ae;
      }
      footer button {
        width: auto;
        margin: 0;
        padding: 0;
        background: none;
        color: #6366f1;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-128.png" alt="" />
      <h1>DCG Scanner Bridge</h1>
    </header>
    <section id="ready" hidden>
      <div class="status"><span class="dot"></span>All set</div>
      <p>You can now scan from the DCG admin panel.</p>
    </section>
    <section id="setup" hidden>
      <div class="status"><span class="dot waiting"></span>One more step</div>
      <p id="setup-text">Allow this extension to connect the admin panel to the scanner.</p>
      <button id="allow">Allow</button>
    </section>
    <footer>
      <span id="version"></span>
      <button id="local" hidden></button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
